services:
  postgres:
    image: postgres:18.6
    container_name: jobhunter-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: jobhunter
      POSTGRES_USER: jobhunter
      POSTGRES_PASSWORD: jobhunter

    ports:
      - "5432:5432"

    volumes:
      - jobhunter_postgres_data:/var/lib/postgresql

  mailpit:
    image: axllent/mailpit:latest
    container_name: jobhunter-mailpit
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  jobhunter_postgres_data: